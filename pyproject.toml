[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-spendee"
version = "0.1.0"
description = "An MCP server for reading and creating Spendee transactions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Kirill Alekseev" },
]
keywords = ["mcp", "spendee", "personal-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.27,<2",
    "spendee @ git+https://github.com/gibsn/spendee.git@a4aa785",
]

[project.scripts]
mcp-spendee = "mcp_spendee.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-anyio>=0.0.0",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_spendee"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
